description = "Machine-checked exact-integer certificates for local/global connectivity switching, matroid intersection obstructions, and parameterized WSAT reductions in switch graphs"
authors = [{ name = "Lluis Eriksson" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
